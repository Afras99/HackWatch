<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HackWatch — Intrusion Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="/demo/js/react.min.js"></script>
<script src="/demo/js/react-dom.min.js"></script>
<script src="/demo/js/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --black:#010308;
  --bg:   #020510;
  --bg2:  #040918;
  --bg3:  #071220;
  --g0:   #00e5ff;
  --g1:   #00b8cc;
  --g2:   #007a88;
  --g3:   #003a44;
  --g4:   rgba(0,229,255,.06);
  --clean:#00ff88;
  --red:  #ff3355;
  --rdim: rgba(255,51,85,.15);
  --yellow:#ffe066;
  --blue: #4488ff;
  --border:#071828;
  --border2:#0d2535;
  --dim:  #3a7a8a;
  --muted:#0d2535;
  --mono: 'Share Tech Mono', monospace;
  --head: 'Orbitron', monospace;
}

html,body{width:100%;height:100%;overflow:hidden;background:var(--black);color:var(--g0);font-family:var(--mono);}
#root{width:100vw;height:100vh;display:grid;grid-template-rows:52px 42px 1fr 140px;overflow:hidden;}

/* ── TAB NAV ── */
.tab-nav{
  grid-row:2;display:flex;align-items:stretch;
  background:var(--bg2);border-bottom:1px solid var(--border2);
  padding:0 18px;gap:2px;position:relative;z-index:9;
}
.tab-btn{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  padding:0 18px;cursor:pointer;border:none;background:none;
  color:var(--dim);transition:all .15s;position:relative;
  text-transform:uppercase;border-bottom:2px solid transparent;
}
.tab-btn:hover{color:var(--g1);}
.tab-btn.active{color:var(--g0);border-bottom-color:var(--g0);}
.tab-btn.active::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:var(--g0);box-shadow:0 0 8px var(--g0);
}

/* ── PAGE WRAPPER ── */
.page{grid-row:3;overflow:hidden;display:flex;flex-direction:column;}
.page.hidden{display:none;}
.footer.hidden{display:none;}

/* ═══════════════ HOME PAGE ═══════════════ */
.home-page{overflow-y:auto;background:var(--bg);}
.home-page::-webkit-scrollbar{width:4px;}
.home-page::-webkit-scrollbar-thumb{background:var(--g3);}

.hero{
  padding:48px 60px 36px;
  background:linear-gradient(135deg,rgba(0,229,255,.04) 0%,transparent 60%);
  border-bottom:1px solid var(--border2);
}
.hero-tag{font-size:9px;letter-spacing:.2em;color:var(--g2);margin-bottom:12px;text-transform:uppercase;}
.hero-title{
  font-family:var(--head);font-size:36px;font-weight:900;
  color:var(--g0);letter-spacing:.1em;line-height:1.1;
  text-shadow:0 0 40px rgba(0,229,255,.3);
  margin-bottom:16px;
}
.hero-subtitle{
  font-size:14px;color:#aaccdd;line-height:1.7;max-width:620px;
  margin-bottom:28px;letter-spacing:.02em;
}
.hero-subtitle strong{color:var(--g0);}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;}
.cta-btn{
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  padding:10px 22px;cursor:pointer;border:1px solid;transition:all .15s;
  text-transform:uppercase;
}
.cta-btn.primary{
  background:rgba(0,229,255,.12);color:var(--g0);border-color:var(--g1);
}
.cta-btn.primary:hover{background:rgba(0,229,255,.22);box-shadow:0 0 16px rgba(0,229,255,.2);}
.cta-btn.secondary{
  background:transparent;color:var(--dim);border-color:var(--border2);
}
.cta-btn.secondary:hover{color:var(--g1);border-color:var(--g2);}

.stats-row{
  display:grid;grid-template-columns:repeat(4,1fr);
  border-bottom:1px solid var(--border2);
}
.stat-card{
  padding:24px 28px;border-right:1px solid var(--border2);
}
.stat-card:last-child{border-right:none;}
.stat-val{
  font-family:var(--head);font-size:28px;font-weight:700;
  color:var(--g0);text-shadow:0 0 20px rgba(0,229,255,.4);
  margin-bottom:4px;
}
.stat-val.green{color:var(--clean);text-shadow:0 0 20px rgba(0,255,136,.4);}
.stat-val.red{color:var(--red);}
.stat-lbl{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;}
.stat-sub{font-size:10px;color:var(--muted);letter-spacing:.04em;}

.home-sections{padding:36px 60px;display:flex;flex-direction:column;gap:36px;}
.home-section-title{
  font-family:var(--head);font-size:13px;font-weight:700;
  color:var(--g0);letter-spacing:.12em;margin-bottom:16px;
  padding-bottom:8px;border-bottom:1px solid var(--border2);
}
.how-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.how-card{
  padding:18px 20px;background:var(--bg2);border:1px solid var(--border2);
}
.how-num{
  font-family:var(--head);font-size:22px;font-weight:900;
  color:var(--g2);margin-bottom:8px;
}
.how-card-title{font-size:11px;color:var(--g0);letter-spacing:.08em;margin-bottom:6px;font-weight:600;}
.how-card-body{font-size:11px;color:#778899;line-height:1.6;}
.exploit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.exploit-row{
  padding:10px 14px;background:var(--bg2);border:1px solid var(--border2);
  display:flex;gap:10px;align-items:flex-start;
}
.exploit-dot{width:8px;height:8px;border-radius:50%;margin-top:3px;flex-shrink:0;}
.exploit-name{font-size:11px;color:var(--g0);letter-spacing:.04em;margin-bottom:3px;}
.exploit-detail{font-size:10px;color:var(--dim);line-height:1.4;}

/* ── MATRIX RAIN CANVAS ── */
#matrix-canvas{position:fixed;inset:0;z-index:0;opacity:.07;pointer-events:none;}

/* ── CRT scanlines ── */
body::after{
  content:'';position:fixed;inset:0;z-index:200;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0,rgba(0,0,0,.13) 1px,transparent 1px,transparent 3px);
}

/* ── GLITCH keyframes ── */
@keyframes glitch1{
  0%,90%,100%{clip-path:none;transform:none}
  92%{clip-path:inset(10% 0 80% 0);transform:translateX(-3px)}
  94%{clip-path:inset(60% 0 10% 0);transform:translateX(3px)}
  96%{clip-path:inset(30% 0 50% 0);transform:translateX(-2px)}
  98%{clip-path:none;transform:translateX(1px)}
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pulse-green{0%,100%{box-shadow:0 0 8px var(--g1)}50%{box-shadow:0 0 20px var(--g0),0 0 40px rgba(0,229,255,.3)}}
@keyframes scanin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes countup{from{opacity:0}to{opacity:1}}
@keyframes alarmflash{0%,100%{background:rgba(255,40,40,.09)}50%{background:rgba(255,40,40,.22)}}

/* ═══════════════ HEADER ═══════════════ */
.hdr{
  grid-row:1;background:var(--bg2);
  border-bottom:1px solid var(--border2);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;position:relative;z-index:10;
}
.hdr::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--g0),transparent);
  box-shadow:0 0 12px var(--g0);
}
.logo{
  font-family:var(--head);font-size:18px;font-weight:900;
  color:var(--g0);letter-spacing:.15em;
  text-shadow:0 0 20px var(--g0),0 0 40px rgba(0,229,255,.4);
  animation:glitch1 6s ease-in-out infinite;
  display:flex;align-items:center;gap:10px;
}
.logo-tag{font-size:9px;color:var(--g2);letter-spacing:.12em;font-family:var(--mono);align-self:flex-end;margin-bottom:2px;}
.hdr-mid{display:flex;align-items:center;gap:16px;}
.task-label{font-size:11px;color:var(--dim);letter-spacing:.06em;}
.task-label em{color:var(--g0);font-style:normal;font-weight:600;}
.live-badge{
  display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.14em;
  color:var(--g0);padding:3px 10px;border:1px solid var(--g2);
  box-shadow:0 0 10px rgba(0,229,255,.15);
}
.pip{width:7px;height:7px;border-radius:50%;background:var(--g0);
  box-shadow:0 0 8px var(--g0);animation:blink 1s ease-in-out infinite;}
.hdr-right{display:flex;align-items:center;gap:10px;}

/* stat pill */
.spill{
  font-size:10px;color:var(--dim);display:flex;gap:5px;align-items:center;
  padding:3px 9px;border:1px solid var(--border2);letter-spacing:.04em;
}
.spill .v{color:var(--g0);font-weight:600;}
.spill.alarm .v{color:var(--red);text-shadow:0 0 8px rgba(255,0,51,.6);}
.spill.ok .v { color: var(--clean); }

/* toggle */
.tog-wrap{display:flex;align-items:center;gap:7px;}
.tog-lbl{font-size:10px;color:var(--muted);cursor:pointer;letter-spacing:.08em;transition:color .15s;}
.tog-lbl.on{color:var(--g1);}
.tog{width:40px;height:20px;background:var(--bg3);border:1px solid var(--border2);position:relative;cursor:pointer;transition:all .15s;}
.tog.on{background:rgba(0,229,255,.1);border-color:var(--g2);}
.tog-knob{position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--muted);transition:transform .15s,background .15s;}
.tog.on .tog-knob{transform:translateX(20px);background:var(--g0);}

/* ═══════════════ TRY IT PAGE ═══════════════ */
.body{width:100%;height:100%;display:grid;grid-template-columns:196px 1fr 288px;overflow:hidden;position:relative;z-index:1;}

/* ═══════════════ RESEARCH PAGE ═══════════════ */
.research-page{overflow-y:auto;background:var(--bg);padding:36px 60px;}
.research-page::-webkit-scrollbar{width:4px;}
.research-page::-webkit-scrollbar-thumb{background:var(--g3);}
.research-section{margin-bottom:40px;}
.research-title{
  font-family:var(--head);font-size:13px;font-weight:700;
  color:var(--g0);letter-spacing:.12em;margin-bottom:16px;
  padding-bottom:8px;border-bottom:1px solid var(--border2);
}
.res-table{width:100%;border-collapse:collapse;font-size:11px;}
.res-table th{
  padding:7px 12px;text-align:left;
  color:var(--dim);letter-spacing:.1em;font-size:9px;text-transform:uppercase;
  border-bottom:1px solid var(--border2);font-weight:400;
}
.res-table td{padding:8px 12px;border-bottom:1px solid var(--border);color:#aabbcc;}
.res-table td:first-child{color:var(--g0);font-family:var(--mono);}
.res-table .hi{color:var(--clean);font-weight:600;}
.res-table .lo{color:var(--yellow);}
.res-table .held{color:var(--dim);font-size:9px;}
.res-2col{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.res-metric-card{
  padding:20px 24px;background:var(--bg2);border:1px solid var(--border2);
}
.res-metric-val{
  font-family:var(--head);font-size:32px;font-weight:700;
  color:var(--g0);text-shadow:0 0 20px rgba(0,229,255,.4);margin-bottom:4px;
}
.res-metric-lbl{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;}
.res-curve-wrap{
  background:var(--bg2);border:1px solid var(--border2);
  padding:16px;height:160px;display:flex;flex-direction:column;
}
.res-curve-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.res-curve-title{font-size:9px;color:var(--dim);letter-spacing:.1em;}
.res-legend{display:flex;gap:12px;}
.res-li{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--dim);}
.res-line{width:16px;height:2px;}
.reward-formula{
  background:var(--bg2);border:1px solid var(--border2);
  border-left:3px solid var(--g0);
  padding:16px 20px;font-size:12px;color:#aabbcc;line-height:2;
  font-family:var(--mono);
}
.reward-formula .pos{color:var(--clean);}
.reward-formula .neg{color:var(--red);}
.reward-formula .neutral{color:var(--g0);}
.reward-row{display:flex;align-items:baseline;gap:8px;margin:2px 0;}
.reward-explain{font-size:10px;color:var(--dim);margin-left:8px;font-style:italic;}

/* ── PANEL BASE ── */
.panel{border-right:1px solid var(--border2);display:flex;flex-direction:column;overflow:hidden;}
.panel:last-child{border-right:none;}
.panel-hdr{
  padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0;
  font-size:9px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg2);
}
.panel-hdr .accent{color:var(--g0);}
.panel-body{flex:1;overflow-y:auto;overflow-x:hidden;}
.panel-body::-webkit-scrollbar{width:3px;}
.panel-body::-webkit-scrollbar-thumb{background:var(--g3);}

/* ═══════════════ LEFT — TASK LIST ═══════════════ */
.left-panel{background:var(--bg2);}
.left-body{padding:4px 0;}
.sec-hdr{
  font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  padding:8px 10px 3px;display:flex;align-items:center;gap:6px;
}
.sec-hdr::after{content:'';flex:1;height:1px;background:var(--border);}

.task-item{
  display:flex;align-items:center;gap:7px;padding:8px 10px 8px 12px;
  cursor:pointer;transition:all .1s;position:relative;
  border-left:2px solid transparent;
}
.task-item:hover{background:var(--g4);border-left-color:var(--g3);}
.task-item.active{
  background:rgba(0,229,255,.08);border-left-color:var(--g0);
  animation:pulse-green 2s ease-in-out infinite;
}
.t-dot{width:8px;height:8px;flex-shrink:0;}
.t-dot.easy  {background:#00ff88;box-shadow:0 0 6px #00ff8880;}
.t-dot.medium{background:var(--yellow);box-shadow:0 0 6px rgba(255,204,0,.5);}
.t-dot.hard  {background:var(--red);box-shadow:0 0 6px rgba(255,0,51,.6);}
.t-name{flex:1;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.task-item.active .t-name{color:var(--g0);}
.t-badge{font-size:8px;padding:1px 4px;background:var(--bg3);border:1px solid var(--border2);color:var(--muted);flex-shrink:0;}
.t-num{font-size:9px;color:var(--muted);flex-shrink:0;width:16px;text-align:right;}

/* ═══════════════ CENTER ═══════════════ */
.center-panel{background:var(--bg);}
.center-hdr{
  padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border2);
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.center-title{
  font-family:var(--head);font-size:14px;font-weight:700;
  color:var(--g0);letter-spacing:.08em;
  text-shadow:0 0 12px rgba(0,229,255,.4);
}
.center-body{
  flex:1;overflow-y:auto;padding:10px 12px;
  display:flex;flex-direction:column;gap:8px;min-height:0;
}
.center-body::-webkit-scrollbar{width:3px;}
.center-body::-webkit-scrollbar-thumb{background:var(--g3);}

/* ── HOW IT WORKS BAR ── */
.how-it-works{
  padding:8px 14px;background:rgba(0,229,255,.04);
  border-bottom:1px solid var(--border2);
  display:flex;flex-direction:column;gap:5px;flex-shrink:0;
}
.hiw-row{display:flex;align-items:center;gap:8px;}
.hiw-pill{
  font-size:9px;letter-spacing:.08em;padding:2px 8px;font-weight:600;
  flex-shrink:0;font-family:var(--mono);
}
.hiw-pill.worker{background:rgba(0,180,255,.15);color:#44ccff;border:1px solid rgba(0,180,255,.3);}
.hiw-pill.monitor{background:rgba(0,255,136,.12);color:#00ff88;border:1px solid rgba(0,255,136,.3);}
.hiw-arrow{color:var(--dim);font-size:11px;flex-shrink:0;}
.hiw-text{font-size:10px;color:var(--dim);letter-spacing:.02em;}

/* ── SECTION LABELS ── */
.section-label{
  font-size:9px;letter-spacing:.1em;padding:4px 8px;
  margin-bottom:2px;flex-shrink:0;
}
.worker-label{color:#44ccff;background:rgba(0,180,255,.08);border-left:2px solid #44ccff;}
.diff-label{color:#aaaacc;background:rgba(100,100,200,.07);border-left:2px solid #6666aa;}

/* execute button */
.exec-btn{
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  color:var(--g0);background:rgba(0,229,255,.08);
  border:1px solid var(--g2);padding:6px 14px;cursor:pointer;
  transition:all .1s;white-space:nowrap;flex-shrink:0;
  text-shadow:0 0 8px rgba(0,229,255,.4);
}
.exec-btn:hover{background:rgba(0,229,255,.15);border-color:var(--g0);box-shadow:0 0 12px rgba(0,229,255,.2);}
.exec-btn.busy{opacity:.4;cursor:wait;pointer-events:none;}

/* ── TERMINAL ── */
.terminal{
  background:#010a02;border:1px solid var(--border2);
  flex-shrink:0;overflow:hidden;position:relative;
}
.term-bar{
  display:flex;align-items:center;gap:6px;padding:5px 12px;
  background:var(--bg3);border-bottom:1px solid var(--border);
}
.w-dot{width:9px;height:9px;border-radius:50%;}
.wr{background:#ff5f57;}.wy{background:#ffbd2e;}.wg{background:#28c840;}
.term-filename{font-size:9px;color:var(--dim);margin-left:auto;letter-spacing:.06em;}
.term-body{
  padding:10px 12px;font-size:12px;line-height:1.8;min-height:110px;
  color:var(--g1);
}
.tc{color:var(--g0);}.tp{color:#00ccff;}.tpath{color:#88aaff;}.tcmd{color:var(--dim);}
.tk{color:#bb88ff;}.tf{color:var(--g0);text-shadow:0 0 6px rgba(0,229,255,.5);}
.tco{color:var(--muted);font-style:italic;}
.cursor{
  display:inline-block;width:8px;height:13px;background:var(--g0);
  vertical-align:text-bottom;animation:blink .8s step-start infinite;
  box-shadow:0 0 8px var(--g0);
}
.term-ok{color:var(--g0);font-size:11px;margin-top:4px;}

/* ── DIFF ── */
.diff-view{background:#010a02;border:1px solid var(--border2);flex-shrink:0;overflow:hidden;}
.diff-bar{
  display:flex;align-items:center;gap:8px;padding:5px 12px;
  background:var(--bg3);border-bottom:1px solid var(--border);
  font-size:9px;color:var(--dim);
}
.d-badge{font-size:9px;padding:1px 5px;font-weight:600;}
.d-badge.a{color:#00ff88;}.d-badge.r{color:var(--red);}
.diff-body{font-size:11px;line-height:1.65;padding:4px 0;}
.dl{display:flex;padding:0 12px;gap:10px;white-space:pre;}
.dl.a{background:rgba(0,255,136,.08);color:#44ff88;}
.dl.r{background:rgba(255,0,51,.1);color:#ff5544;}
.dl.c{color:var(--muted);}
.dg{width:12px;flex-shrink:0;user-select:none;opacity:.6;}

/* ── PROGRESS ── */
.prog{flex-shrink:0;}
.prog-meta{
  display:flex;justify-content:space-between;align-items:center;
  font-size:10px;color:var(--dim);margin-bottom:5px;letter-spacing:.04em;
}
.prog-pct{color:var(--g0);font-weight:600;}
.prog-track{height:4px;background:var(--border);overflow:hidden;position:relative;}
.prog-fill{
  height:100%;background:var(--g0);transition:width .08s linear;
  box-shadow:0 0 10px var(--g0);position:relative;overflow:hidden;
}
.prog-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  animation:sh .9s ease-in-out infinite;
}
@keyframes sh{from{transform:translateX(-200%)}to{transform:translateX(400%)}}
.prog-fill.done{background:var(--g0);}

/* ── EPISODE LOG ── */
.ep-log{
  flex:1;min-height:80px;background:#010a02;border:1px solid var(--border2);
  display:flex;flex-direction:column;overflow:hidden;
}
.ep-hdr{
  padding:5px 12px;background:var(--bg3);border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0;
  font-size:9px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;
}
.ep-body{flex:1;overflow-y:auto;padding:3px 0;min-height:0;}
.ep-body::-webkit-scrollbar{width:2px;}
.ep-body::-webkit-scrollbar-thumb{background:var(--g3);}
.ep-row{display:flex;gap:8px;padding:2px 12px;font-size:10.5px;line-height:1.75;align-items:baseline;}
.ep-step{color:var(--muted);flex-shrink:0;width:38px;font-size:9px;}
.ep-msg{flex:1;}

/* ═══════════════ RIGHT — VERDICT ═══════════════ */
.right-panel{background:var(--bg2);transition:box-shadow .3s;}
.right-panel.exploit{box-shadow:inset -2px 0 0 var(--red),inset 0 0 40px rgba(255,0,51,.07);}
.right-panel.clean{box-shadow:inset -2px 0 0 var(--g2);}
.right-body{padding:10px;overflow-y:auto;flex:1;}
.right-body::-webkit-scrollbar{width:3px;}
.right-body::-webkit-scrollbar-thumb{background:var(--g3);}

/* ── VERDICT CARD ── */
.vcard{
  padding:16px;margin-bottom:10px;border:1px solid var(--border2);
  position:relative;overflow:hidden;transition:all .25s;
}
.vcard.exploit{
  border-color:rgba(255,60,60,.75);
  background:linear-gradient(135deg,rgba(255,40,40,.14),rgba(180,0,20,.06));
  animation:alarmflash 2s ease-in-out infinite;
  box-shadow:0 0 18px rgba(255,30,30,.18);
}
.vcard.clean{
  border-color:rgba(0,220,100,.45);
  background:linear-gradient(135deg,rgba(0,220,100,.1),rgba(0,180,80,.03));
  box-shadow:0 0 12px rgba(0,220,100,.1);
}
/* blinking corner triangle */
.vcard.exploit::before{
  content:'';position:absolute;top:0;right:0;
  width:0;height:0;
  border-top:28px solid var(--red);
  border-left:28px solid transparent;
  animation:blink 1.2s ease-in-out infinite;
  filter:drop-shadow(0 0 4px var(--red));
}
.v-conf{
  position:absolute;top:10px;right:12px;
  font-family:var(--head);font-size:22px;font-weight:700;
}
.v-conf.exploit{color:#ff4444;text-shadow:0 0 16px rgba(255,50,50,.8);}
.v-conf.clean  {color:#00dd66;text-shadow:0 0 16px rgba(0,220,100,.7);}
.v-conf-lbl{position:absolute;top:34px;right:12px;font-size:8px;color:var(--dim);letter-spacing:.1em;}
.v-icon{font-size:20px;margin-bottom:4px;}
.v-title{
  font-family:var(--head);font-size:16px;font-weight:700;
  letter-spacing:.06em;margin-bottom:8px;line-height:1.2;
}
.v-title.exploit{color:#ff5555;text-shadow:0 0 20px rgba(255,50,50,.7);}
.v-title.clean  {color:#00dd66;text-shadow:0 0 14px rgba(0,220,100,.6);}
.v-tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:9px;letter-spacing:.1em;padding:2px 7px;
  background:rgba(255,0,51,.2);color:#ff8888;border:1px solid rgba(255,80,80,.5);
  font-family:var(--mono);text-transform:uppercase;
}
.v-exploit-block{
  margin-top:10px;padding:10px 12px;
  background:rgba(255,30,30,.12);
  border-left:3px solid #ff4444;
  border-radius:0 2px 2px 0;
}
.v-exploit-label{
  font-size:8px;letter-spacing:.14em;color:#ff8888;
  text-transform:uppercase;margin-bottom:4px;opacity:.8;
}
.v-exploit-desc{
  font-size:12px;color:#ffcccc;line-height:1.5;font-family:var(--mono);
}
.v-clean-sub{font-size:10px;color:var(--dim);margin-top:5px;letter-spacing:.04em;}
.cheat-banner{
  margin-top:10px;padding:14px 16px;
  background:rgba(255,50,50,.1);border:1px solid rgba(255,80,80,.4);
  border-left:3px solid var(--red);
}
.cheat-banner-title{font-size:12px;color:#ff7777;font-weight:600;margin-bottom:6px;letter-spacing:.04em;}
.cheat-banner-sub{font-size:11px;color:#cc8888;line-height:1.6;}
.cheat-banner-sub strong{color:#ffaaaa;}
.clean-banner{
  margin-top:10px;padding:14px 16px;
  background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.25);
  border-left:3px solid var(--clean);
}
.clean-banner-title{font-size:12px;color:var(--clean);font-weight:600;margin-bottom:6px;letter-spacing:.04em;}
.clean-banner-sub{font-size:11px;color:#66cc99;line-height:1.6;}
.gt-flash{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(2,3,2,.92);font-size:11px;color:var(--g0);letter-spacing:.08em;
  animation:gtf 1.8s ease-in-out forwards;pointer-events:none;
  text-shadow:0 0 12px var(--g0);
}
@keyframes gtf{0%{opacity:0}8%{opacity:1}70%{opacity:1}100%{opacity:0}}

/* ── SEP ── */
.sep{height:1px;background:var(--border);margin:9px 0;}

/* ── REWARD BARS ── */
.r-section{margin-bottom:10px;}
.r-title{
  font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-bottom:7px;padding-bottom:4px;
  border-bottom:1px solid var(--border);
}
.r-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;position:relative;cursor:default;}
.r-label{font-size:10.5px;color:var(--dim);width:74px;flex-shrink:0;}
.r-track{flex:1;height:8px;background:var(--border);overflow:hidden;}
.r-fill{height:100%;transition:width 1s cubic-bezier(.4,0,.2,1);}
.r-fill.g{background:var(--g0);box-shadow:0 0 8px rgba(0,229,255,.5);}
.r-fill.r{background:var(--red);box-shadow:0 0 8px rgba(255,0,51,.5);}
.r-fill.y{background:var(--yellow);box-shadow:0 0 6px rgba(255,204,0,.4);}
.r-val{font-size:10.5px;width:30px;text-align:right;flex-shrink:0;font-weight:600;}
.r-row.hl .r-label{color:var(--red);}
.r-row.hl .r-val{color:var(--red);}
.r-tip{
  position:absolute;left:0;top:calc(100%+4px);z-index:20;
  background:var(--bg3);border:1px solid var(--border2);
  padding:4px 8px;font-size:9px;color:var(--g1);
  white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.8);pointer-events:none;
}

/* ── SPARK ── */
.spk-wrap{display:flex;align-items:center;}
.spk-dot{
  width:12px;height:12px;flex-shrink:0;cursor:default;transition:transform .1s;
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
}
.spk-dot:hover{transform:scale(1.5);}
.spk-dot.ok  {background:var(--g0);box-shadow:0 0 6px rgba(0,229,255,.6);}
.spk-dot.bad {background:var(--red);box-shadow:0 0 8px rgba(255,0,51,.7);}
.spk-dot.last{background:var(--red);animation:blink 1s ease-in-out infinite;box-shadow:0 0 12px var(--red);}
.spk-seg{flex:1;height:1px;background:var(--border);}

/* ── DONUT ── */
.dnt-wrap{display:flex;align-items:center;gap:12px;}
.dnt-leg{flex:1;}
.dnt-item{display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:10px;color:var(--dim);}
.dnt-sw{width:8px;height:8px;flex-shrink:0;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);}
.dnt-pct{margin-left:auto;font-weight:600;}

/* ═══════════════ FOOTER ═══════════════ */
.footer{
  grid-row:4;background:var(--bg2);
  border-top:1px solid var(--border2);
  display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1;
}
.footer-hdr{
  padding:6px 16px;border-bottom:1px solid var(--border);flex-shrink:0;
  font-size:8.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;
}
.f-legend{display:flex;gap:14px;}
.f-li{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--dim);}
.f-line{width:18px;height:2px;flex-shrink:0;}
.f-chip{font-size:9px;color:var(--dim);padding:2px 7px;border:1px solid var(--border2);display:flex;gap:5px;}
.f-chip .v{color:var(--g0);}
.footer-body{flex:1;padding:3px 14px 6px;overflow:hidden;display:flex;flex-direction:column;min-height:0;width:100%;}
/* ═══════════════ LOGS PAGE ═══════════════ */
.logs-page{overflow-y:auto;background:var(--bg);padding:36px 60px;}
.logs-page::-webkit-scrollbar{width:4px;}
.logs-page::-webkit-scrollbar-thumb{background:var(--g3);}
.logs-section{margin-bottom:40px;}
.logs-section-title{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--g0);text-transform:uppercase;margin-bottom:16px;border-left:3px solid var(--g0);padding-left:10px;}
.logs-meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;}
.logs-meta-chip{background:var(--panel);border:1px solid var(--border2);padding:6px 14px;font-size:10px;color:var(--dim);font-family:var(--mono);}
.logs-meta-chip .lm-key{color:var(--g0);margin-right:6px;}
.run-hist-table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:20px;}
.run-hist-table th{text-align:left;padding:6px 10px;color:var(--muted);font-weight:600;letter-spacing:1px;border-bottom:1px solid var(--border2);font-size:9px;}
.run-hist-table td{padding:6px 10px;border-bottom:1px solid var(--border);color:#aabbcc;font-family:var(--mono);}
.run-hist-table tr.best-run td{color:var(--g0);background:rgba(0,229,255,.04);}
.run-hist-table tr.best-run td:first-child{font-weight:700;}
.run-hist-table .tag-bad{color:var(--red);font-size:9px;}
.run-hist-table .tag-ok{color:var(--clean);font-size:9px;}
.run-hist-table .tag-crash{color:var(--yellow);font-size:9px;}
.step-log{width:100%;border-collapse:collapse;font-size:10px;}
.step-log th{text-align:right;padding:5px 12px;color:var(--muted);font-weight:600;letter-spacing:1px;border-bottom:1px solid var(--border2);font-size:9px;}
.step-log th:first-child{text-align:left;}
.step-log td{padding:5px 12px;border-bottom:1px solid var(--border);color:#aabbcc;font-family:var(--mono);text-align:right;}
.step-log td:first-child{text-align:left;color:var(--dim);}
.step-log tr.peak-row td{color:var(--g0);background:rgba(0,229,255,.06);}
.step-log tr.spike-row td{color:var(--yellow);}
.step-log .bar{display:inline-block;height:6px;background:var(--g0);opacity:.7;vertical-align:middle;margin-right:6px;}
.log-note{font-size:10px;color:var(--muted);margin-top:8px;padding-left:4px;line-height:1.6;}
.log-note strong{color:var(--g1);}

<script>
// Matrix rain animation
(function(){
  const canvas=document.getElementById('matrix-canvas');
  const ctx=canvas.getContext('2d');
  let W,H,cols,drops;
  const CHARS='01アイウエオカキクケコサシスセソタチツテトナニヌネノ';
  function init(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
    const fs=13;
    cols=Math.floor(W/fs);
    drops=Array(cols).fill(1);
  }
  function draw(){
    ctx.fillStyle='rgba(2,3,2,0.05)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#00cc33';
    ctx.font='13px Share Tech Mono';
    drops.forEach((y,i)=>{
      const c=CHARS[Math.floor(Math.random()*CHARS.length)];
      ctx.fillStyle=y<3?'#00b8cc':'#003a44';
      ctx.fillText(c,i*13,y*13);
      if(y*13>H&&Math.random()>.975) drops[i]=0;
      drops[i]++;
    });
  }
  init();
  window.addEventListener('resize',init);
  setInterval(draw,50);
})();
</script>

// ── Terminal ──────────────────────────────────────────────────────────────────
function Terminal({ taskId, running }) {
  const lines=CODES[taskId]||CODES.sort;
  const [vl,setVl]=useState(lines.length);
  const [vc,setVc]=useState(999);
  const tmr=useRef();
  useEffect(()=>{
    clearInterval(tmr.current);
    if(!running){setVl(lines.length);setVc(999);return;}
    setVl(0);setVc(0);
    let li=0,ci=0;
    tmr.current=setInterval(()=>{
      const ll=lines[li]?.reduce((s,x)=>s+x.s.length,0)||0;
      ci+=Math.floor(Math.random()*5)+3; // faster typing
      if(ci>=ll){li++;ci=0;if(li>=lines.length){clearInterval(tmr.current);setVl(lines.length);setVc(999);return;}}
      setVl(li);setVc(ci);
    },16); // faster interval
    return()=>clearInterval(tmr.current);
  },[taskId,running]);
  const isTyping=running&&vl<lines.length;
  const renderSegs=(segs,maxC,showCur)=>{
    let rem=maxC;const out=[];
    for(const seg of segs){
      if(rem<=0)break;
      const s=seg.s.slice(0,rem);rem-=s.length;
      let st={color:'#b08840'};
      if(seg.t==='k') st={color:'#aa66ff'};
      else if(seg.t==='f') st={color:'#00e5ff',textShadow:'0 0 6px rgba(0,229,255,.4)'};
      else if(seg.t==='co') st={color:'#071828',fontStyle:'italic'};
      out.push(<span key={out.length} style={st}>{s}</span>);
    }
    if(showCur&&isTyping) out.push(<span key="c" className="cursor"/>);
    return out;
  };
  return (
    <div className="terminal">
      <div className="term-bar">
        <div className="w-dot wr"/><div className="w-dot wy"/><div className="w-dot wg"/>
        <span className="term-filename">worker@sandbox:~/{taskId}$</span>
      </div>
      <div className="term-body">
        <div style={{marginBottom:6}}>
          <span className="tc">root</span>
          <span style={{color:'#0d4455'}}>@</span>
          <span className="tp">hackwatch-sandbox</span>
          <span style={{color:'#0d4455'}}>:</span>
          <span className="tpath">~/{taskId}</span>
          <span style={{color:'#0d4455'}}>$ </span>
          <span className="tcmd">python -m worker run --ep 0247</span>
        </div>
        {lines.map((segs,li)=>{
          if(li>vl) return null;
          return (
            <div key={li} style={{fontFamily:'var(--mono)',fontSize:12,lineHeight:1.8}}>
              {renderSegs(segs,li<vl?999:vc,li===vl)}
            </div>
          );
        })}
        {!isTyping&&vl>=lines.length&&(
          <div className="term-ok">■ process exited [code 0]</div>
        )}
      </div>
    </div>
  );
}

  const adds=rows.filter(r=>r.t==='a').length;
  const rems=rows.filter(r=>r.t==='r').length;

      stroke={DONUT_COLS[i]} strokeWidth={sw}

      style={{transform:'rotate(-90deg)',transformOrigin:'center',filter:`drop-shadow(0 0 4px ${DONUT_COLS[i]}88)`}}/>;
    off+=dash;return el;

// ── Training Curve ────────────────────────────────────────────────────────────
function TrainingCurve({ step }) {
  const ref=useRef();
  const [dims,setDims]=useState({w:800,h:80});
  useEffect(()=>{
    const el=ref.current;if(!el)return;
    const ro=new ResizeObserver(en=>{
      const{width,height}=en[0].contentRect;
      if(width>0&&height>0)setDims({w:Math.floor(width),h:Math.floor(height)});
    });
    ro.observe(el);
    const r=el.getBoundingClientRect();
    if(r.width>0)setDims({w:Math.floor(r.width),h:Math.floor(r.height)});
    return()=>ro.disconnect();
  },[]);
  const{w:W,h:H}=dims;
  const PL=26,PR=8,PT=5,PB=17;
  const iw=W-PL-PR,ih=H-PT-PB;
  const vis=CURVE.slice(0,Math.max(2,step));
  const maxS=CURVE[CURVE.length-1].s;
  const xS=d=>PL+(d.s/maxS)*iw;
  const yS=v=>PT+ih-((v-.3)/.65)*ih;
  const f1p=vis.map((d,i)=>`${i?'L':'M'}${xS(d).toFixed(1)},${yS(d.f1).toFixed(1)}`).join(' ');
  const wkp=vis.map((d,i)=>`${i?'L':'M'}${xS(d).toFixed(1)},${yS(d.wk).toFixed(1)}`).join(' ');
  const last=vis[vis.length-1];
  const yT=[.4,.6,.8],xT=[0,5000,10000,15000,20000];
  return (
    <div ref={ref} style={{flex:1,minHeight:0,width:'100%',position:'relative'}}>
      <svg width={W} height={H} style={{position:'absolute',inset:0,overflow:'visible'}}>
        <defs>
          <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#00e5ff" stopOpacity=".15"/>
            <stop offset="100%" stopColor="#00e5ff" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {yT.map(v=>(
          <React.Fragment key={v}>
            <line x1={PL} x2={W-PR} y1={yS(v)} y2={yS(v)} stroke="#041018" strokeWidth="1"/>
            <text x={PL-4} y={yS(v)} textAnchor="end" dominantBaseline="middle"
              style={{fontFamily:'var(--mono)',fontSize:8,fill:'#0d4455'}}>{v.toFixed(1)}</text>
          </React.Fragment>
        ))}
        {xT.map(v=>(
          <text key={v} x={xS({s:v})} y={H-2} textAnchor="middle"
            style={{fontFamily:'var(--mono)',fontSize:8,fill:'#0d4455'}}>
            {v===0?'0':`${v/1000}k`}
          </text>
        ))}
        {vis.length>1&&<path d={`${f1p} L${xS(last)},${PT+ih} L${xS(vis[0])},${PT+ih} Z`} fill="url(#gg)"/>}
        {vis.length>1&&<>
          <path d={wkp} fill="none" stroke="#0066cc" strokeWidth="1.5" opacity=".6"/>
          <path d={f1p} fill="none" stroke="#00e5ff" strokeWidth="2.5"
            style={{filter:'drop-shadow(0 0 5px rgba(0,229,255,.6))'}}/>
        </>}
        {last&&<rect x={xS(last)-3} y={yS(last.f1)-3} width="6" height="6"
          fill="#00e5ff" style={{filter:'drop-shadow(0 0 6px #e8a000)'}}/>}
        {step>50&&<>
          <line x1={xS({s:3000})} x2={xS({s:3000})} y1={PT} y2={PT+ih}
            stroke="#ff0033" strokeWidth="1" strokeDasharray="3 3" opacity=".5"/>
          <text x={xS({s:3200})} y={PT+10}
            style={{fontFamily:'var(--mono)',fontSize:8,fill:'#ff3300',opacity:.8}}>
            exploit discovered
          </text>
        </>}
      </svg>
    </div>
  );
}

            <div className="f-chip"><span>F1</span><span className="v">{f1Final.toFixed(2)}</span></div>
            <div className="f-chip"><span>steps</span><span className="v">20k</span></div>
            <div className="f-chip"><span>precision</span><span className="v">0.91</span></div>
          </div>
        </div>
        <div className="footer-body">
          <TrainingCurve step={cStep}/>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
