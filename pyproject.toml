[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hackwatch"
version = "0.1.0"
description = "OpenEnv-compatible RL environment for detecting reward-hacking in coding agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "gitpython>=3.1.40",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
]
training = [
    "trl==0.22.2",
    "torch==2.5.1",
    "datasets>=2.18.0",
    "wandb>=0.16.0",
    "peft>=0.10.0",
    "transformers==4.55.4",
    "unsloth==2025.9.6",
    "vllm==0.10.2",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hackwatch", "server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
