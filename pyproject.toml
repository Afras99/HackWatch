[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hackwatch"
version = "0.1.0"
description = "OpenEnv-compatible RL environment for detecting reward-hacking in coding agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "gitpython>=3.1.40",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "gitpython>=3.1.40",
    "scikit-learn>=1.4.0",
]
training = [
    "trl>=0.24.0",
    "torch>=2.2.0",
    "datasets>=2.18.0",
    "wandb>=0.16.0",
    "optuna>=3.6.0",
    "peft>=0.10.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

# Third-party packages can declare exploit primitives here:
#   [project.entry-points."hackwatch.exploits"]
#   my_primitive = "mypkg.exploits:my_primitive_fn"
# They will be auto-registered in ALL_PRIMITIVES at import time.

[tool.hatch.build.targets.wheel]
packages = ["hackwatch", "server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
