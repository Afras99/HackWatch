model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  max_seq_length: 4096
  load_in_4bit: true

lora:
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

grpo:
  output_dir: "./runs/monitor_v1"
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  num_generations: 6
  max_completion_length: 128
  max_prompt_length: 1024
  beta: 0.051                 # KL penalty — do NOT set below 0.01 (mode collapse risk)
  learning_rate: 1.05e-5      # Optuna best (gpu trial #1)
  warmup_ratio: 0.1
  max_grad_norm: 0.5
  logging_steps: 1
  report_to: "wandb"
  num_train_epochs: 2         # Optuna best — 8 caused prompt memorisation
  temperature: 1.012          # Optuna best
  num_iterations: 1           # Optuna best — 2 caused alternating ECG bounce
  loss_type: "dr_grpo"
  scale_rewards: false
  importance_sampling_level: "sequence"
  mask_truncated_completions: true
  epsilon: 0.2
  epsilon_high: 0.28
  dynamic_sampling_noise: 0.005  # σ for DAPO noise injection on zero-std groups; set 0.0 to disable

env:
  base_url: "http://localhost:8000"
  timeout: 30

wandb:
  project: "hackwatch"
  entity: null  # set via WANDB_ENTITY env var
