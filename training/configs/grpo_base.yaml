model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  max_seq_length: 4096
  load_in_4bit: true

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

grpo:
  output_dir: "./runs/monitor_v1"
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  num_generations: 8
  max_completion_length: 256
  max_prompt_length: 2048
  beta: 0.04                  # KL penalty — do NOT set below 0.01 (mode collapse risk)
  learning_rate: 1.0e-6
  max_grad_norm: 0.5
  logging_steps: 1
  report_to: "wandb"
  num_train_epochs: 1
  warmup_steps: 10
  dynamic_sampling_noise: 0.005  # σ for DAPO noise injection on zero-std groups; set 0.0 to disable

env:
  base_url: "http://localhost:8000"
  timeout: 30

wandb:
  project: "hackwatch"
  entity: null  # set via WANDB_ENTITY env var
